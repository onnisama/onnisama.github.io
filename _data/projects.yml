hosted:
  - name: "扩散原野"
    repo_name: "Diffusion_field"
    tagline: "从直觉、公式到代码，系统学习 DDPM 与扩散模型。"
    description: "一个面向中文学习者的交互式扩散模型学习网站。内容从前向加噪与噪声调度出发，逐步进入高斯分布、反向采样、U-Net 和最小 PyTorch 实现；公式推导、数值实验和可视化在同一条学习路径中相互对应。"
    highlights:
      - "用真实闭式公式演示像素加噪、二维点云扩散与噪声调度。"
      - "提供 DDPM 论文公式精读、交互式 U-Net 张量图和常见误解自检。"
      - "学习进度保存在本地，并适配深浅色主题与移动端。"
    stack:
      - "Next.js"
      - "TypeScript"
      - "DDPM"
    github: "https://github.com/onnisama/Diffusion_field"
    website: "https://diffusion.onnisama.top"
    website_label: "访问学习diffusion"
    status: "已完成"
    status_kind: "complete"

  - name: "Earth Online"
    repo_name: "Earth_ONLINE"
    tagline: "把签到、任务、小游戏和生活决策组织成一套成长系统。"
    description: "一个游戏化生活面板，将每日签到、塔罗运势、任务、饮食选择、小游戏、奖励与成就连接成连续的反馈循环。访客可以直接体验，登录用户还可通过 Supabase 同步资料、每日记录和好友关系。"
    highlights:
      - "内置 2048、扫雷、迷宫、跑酷等小游戏，以及商店和成就系统。"
      - "支持每日任务、饮食随机决策、塔罗结果持久化和玩家成长属性。"
      - "通过 Supabase 提供账号同步、公开资料、好友请求和排行榜。"
    stack:
      - "Vue 3"
      - "Pinia"
      - "Supabase"
    github: "https://github.com/onnisama/Earth_ONLINE"
    website: "https://earth.onnisama.top"
    website_label: "进入 Earth Online"
    status: "已完成"
    status_kind: "complete"

  - name: "高考祝福一键生成器"
    repo_name: "Exam_Wishes"
    tagline: "根据对象、风格和篇幅，生成一封不那么模板化的高考祝福信。"
    description: "一个面向高考季的 AI 祝福信生成网站。用户填写姓名、祝福风格、字数长度与补充信息后，由服务端调用 DeepSeek 生成书信体内容，并支持逐字呈现、一键复制和重新生成。"
    highlights:
      - "提供温柔治愈、热血励志和文艺高级三种表达方向。"
      - "通过白名单、输入裁剪与动态 token 上限控制生成成本和输出边界。"
      - "API Key 只在服务端使用，浏览器不会直接接触模型密钥。"
    stack:
      - "Next.js"
      - "TypeScript"
      - "DeepSeek"
    github: "https://github.com/onnisama/Exam_Wishes"
    website: "https://wishes.onnisama.top"
    website_label: "生成一封祝福"
    status: "已完成"
    status_kind: "complete"

  - name: "济事楼导览系统"
    repo_name: "Jishilou_Guidance_System"
    tagline: "把楼层地图、房间查询与实景照片放进同一套导览流程。"
    description: "一个面向济事楼 4—5 层的网页导览系统。用户可以在 SVG 平面图上查看房间位置，按房间号、部门或人员姓名搜索，并在不离开地图的情况下阅读房间用途与人员信息。"
    highlights:
      - "楼层图、搜索结果、房间列表与详情面板保持同步。"
      - "支持 AI 导览助手，以及从门口到楼层房间的实景照片导览。"
      - "保留当前楼层、搜索词与选中房间，减少页面切换带来的迷失感。"
    stack:
      - "Vue 3"
      - "Vite"
      - "SVG"
    github: "https://github.com/onnisama/Jishilou_Guidance_System"
    website: "https://guidance.onnisama.top"
    website_label: "打开楼层导览"
    status: "已完成"
    status_kind: "complete"

  - name: "神秘之镜 · AI 塔罗"
    repo_name: "Mysterious_Mirror_AI_Tarot"
    tagline: "以三张牌阵和交互翻牌完成一次轻量的 AI 塔罗体验。"
    description: "一个基于 React 的三张牌塔罗占卜网站。用户完成抽牌与翻牌后，系统通过服务端代理请求 DeepSeek 生成解读；当 AI 不可用时，也会自动切换到本地兜底内容，保证完整流程仍然可以继续。"
    highlights:
      - "实现洗牌、抽牌、翻牌和结果展示的完整交互流程。"
      - "使用星空背景、光晕与玻璃质感构建沉浸式视觉。"
      - "服务端代理模型请求，并为异常情况提供离线解读。"
    stack:
      - "React"
      - "Vite"
      - "DeepSeek"
    github: "https://github.com/onnisama/Mysterious_Mirror_AI_Tarot"
    website: "https://tarot.onnisama.top"
    website_label: "开始塔罗占卜"
    status: "已完成"
    status_kind: "complete"

  - name: "雾汐猜歌房"
    repo_name: "Songs_guessing"
    tagline: "无需登录，通过邀请码和朋友进行一局实时猜歌。"
    description: "一个轻量的多人联机猜歌与猜歌词平台。房主可以维护自己的题库并创建房间，玩家轮流猜字，后端负责揭示命中字符、推进轮次、处理倒计时和判定胜负，完整答案只在结算后返回。"
    highlights:
      - "支持邀请码加入、在线状态、实时同步、倒计时和下一局准备。"
      - "题库管理包含新增、编辑、筛选、挂起、归档和批量操作。"
      - "答案与高权限密钥保留在服务端，前端只接收脱敏后的游戏状态。"
    stack:
      - "Vue 3"
      - "Supabase"
      - "Vercel Functions"
    github: "https://github.com/onnisama/Songs_guessing"
    website: "https://guess.onnisama.top"
    website_label: "进入猜歌房"
    status: "已完成"
    status_kind: "complete"

  - name: "云物栈"
    repo_name: "Storage-Box-mini-program"
    tagline: "把自然语言中的安排解析成可追踪、可统计的结构化待办。"
    description: "一个微信小程序任务收纳工具。用户可以输入聊天记录或口头安排，云函数调用模型提取标题、时间、地点和备注，再将结果放入任务流、日历、日志和统计页面中。项目代码已经整理为开源学习方案，但因个人主体小程序审核对深度合成功能的限制而未继续上线。"
    highlights:
      - "支持 AI 任务解析、任务状态流转、日历查看和操作日志。"
      - "提供完成率等使用统计，以及界面色调和排序设置。"
      - "模型密钥通过云函数环境变量注入，不写入小程序前端。"
    stack:
      - "微信小程序"
      - "云函数"
      - "DeepSeek"
    github: "https://github.com/onnisama/Storage-Box-mini-program"
    status: "已完成"
    status_kind: "complete"

collaborative:
  - name: "ClubHub"
    repo_name: "Palind-Rome/ClubHub"
    tagline: "面向高校社团日常运营与协作的一体化管理平台。"
    description: "一个数据库课程设计协作项目，计划覆盖社团组织与成员、活动和场地、项目任务、课程资源、运营评价、公告通知与讨论等流程。项目采用前后端分离架构，并通过 OpenAPI、Issue、Pull Request 和持续集成支持多人协作。"
    highlights:
      - "后端采用 ASP.NET Core Web API，前端使用 Vue 3 与 Vite。"
      - "以 Oracle 为数据核心，围绕真实社团运营流程设计业务模型。"
      - "当前仍在继续完善功能、部署与课程交付材料。"
